<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fans</title>
<meta name="description" content="Fans — latest celeb updates, exclusive photos and viral videos.">
<meta name="theme-color" content="#0e0504">
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+Sinhala:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Abhaya+Libre:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e5261b;--orange:#f7941d;--yellow:#ffd21f;--deep:#8f1d12;
  --bg:#0e0504;--card:#1b0b09;--text:#fff3e4;--muted:#c4a597;--line:rgba(255,200,150,.15);
  --grad:linear-gradient(90deg,#e5261b,#f7941d,#ffd21f);
  --grad2:linear-gradient(135deg,#e5261b,#f7941d);
  /* Sinhala letters automatically use --font-si, English letters use Poppins / Bangers */
  --font-si:'Abhaya Libre','Noto Sans Sinhala';
  --font-head:'Bangers',var(--font-si),system-ui,sans-serif;
  --font-body:'Poppins',var(--font-si),system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--text);font-family:var(--font-body);line-height:1.55;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 620px at 8% -8%,rgba(229,38,27,.38),transparent 62%),
  radial-gradient(820px 620px at 100% 28%,rgba(247,148,29,.24),transparent 62%),
  radial-gradient(760px 520px at 28% 112%,rgba(255,210,31,.14),transparent 62%)}
body::after{content:"";display:none;position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(rgba(255,255,255,.075) 1.2px,transparent 1.6px) 0 0/16px 16px;-webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%)}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--orange);color:#2a0a08}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#150706}::-webkit-scrollbar-thumb{background:linear-gradient(#e5261b,#f7941d);border-radius:10px}
.wrap{width:100%;max-width:1920px;margin:0 auto;padding:0 clamp(14px,3vw,48px)}
.hidden{display:none!important}

/* buttons & fields */
.btn{position:relative;overflow:hidden;border:0;border-radius:12px;padding:10px 22px;font-family:var(--font-head);letter-spacing:1.5px;font-size:18px;cursor:pointer;background:var(--grad2);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);box-shadow:0 8px 24px rgba(229,38,27,.35);transition:transform .2s,box-shadow .2s;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(247,148,29,.5)}
.btn:hover::after{left:130%}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);box-shadow:none;text-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.12);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#8f1d12,#c4271b)}
.btn.sm{font-size:14px;padding:5px 13px;border-radius:9px;letter-spacing:1px}
.btn[disabled]{opacity:.55;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label{font-weight:600;font-size:13px;color:#ffd9b8}
.field small{color:var(--muted);font-size:12px}
.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:rgba(0,0,0,.35);outline:none;transition:.25s}
.in::placeholder{color:#8f7469}
.in:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(247,148,29,.18)}
textarea.in{resize:vertical;min-height:92px}

/* embeds (modal + admin preview) */
.embed{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.embed iframe{width:100%;max-width:500px;border:1px solid var(--line);border-radius:16px;background:#fff}
.embed .yt{aspect-ratio:16/9;max-width:100%;height:auto}
.embed img,.embed video{max-width:100%;border-radius:16px;border:1px solid var(--line);background:#000}
.embed .src{font-size:12px;color:var(--muted);font-weight:600;text-decoration:none;transition:.2s}
.embed .src:hover{color:var(--orange)}
.linkcard{display:flex;gap:14px;width:100%;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.05);text-decoration:none;overflow:hidden;transition:.25s}
.linkcard:hover{border-color:var(--orange);transform:translateY(-2px)}
.linkcard img{width:150px;object-fit:cover;border:0;border-radius:0;flex-shrink:0}
.linkcard div{padding:12px 14px;min-width:0}
.linkcard b{display:block;line-height:1.3;overflow-wrap:anywhere}
.linkcard small{color:var(--muted);font-weight:600;overflow-wrap:anywhere}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:rgba(20,8,6,.92);backdrop-filter:blur(10px);border:1px solid var(--orange);color:var(--yellow);padding:11px 24px;border-radius:999px;font-family:var(--font-head);letter-spacing:1px;font-size:18px;opacity:0;transition:.3s;z-index:200;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:#9c1c12;color:#fff;border-color:#ff7a6e}

/* skeleton */
.sk{position:relative;overflow:hidden;background:rgba(255,255,255,.06);border-radius:20px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.1) 50%,transparent 80%);transform:translateX(-100%);animation:shimmer 1.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* progress + blobs */
.progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--grad);z-index:100;box-shadow:0 0 12px var(--orange)}
.blobs{display:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:420px;height:420px;background:var(--red);left:-120px;top:20%}
.blobs i:nth-child(2){width:360px;height:360px;background:var(--orange);right:-100px;top:55%;animation-delay:-8s}
.blobs i:nth-child(3){width:300px;height:300px;background:var(--yellow);left:45%;top:-120px;animation-delay:-14s;opacity:.16}
@keyframes drift{to{transform:translate(90px,-70px) scale(1.25)}}

/* ticker */
.ticker{background:var(--grad);color:#2a0a08;overflow:hidden;white-space:nowrap;font-family:var(--font-head);letter-spacing:2px;font-size:15px;padding:4px 0}
.ticker .track{display:inline-block;animation:marq 46s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}

/* nav */
.nav{position:sticky;top:0;z-index:60;background:rgba(14,5,4,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transform:translateZ(0);border-bottom:1px solid var(--line)}
.nav::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,#e5261b,#f7941d,#ffd21f,#f7941d,#e5261b);background-size:200% 100%}
@keyframes flow{to{background-position:200% 0}}
.nav-row{display:flex;align-items:center;gap:22px;padding-top:8px;padding-bottom:8px}
.brand{display:block;line-height:0;flex-shrink:0}
.brand img{height:64px;width:auto;filter:drop-shadow(0 0 10px rgba(247,148,29,.55));transition:transform .3s}
.brand:hover img{transform:scale(1.06) rotate(-2deg)}

@keyframes floaty{50%{transform:translateY(-3px)}}
.by{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;padding:6px 14px 6px 8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);transition:.25s}
.by:hover{border-color:var(--orange);background:rgba(255,255,255,.1);transform:translateY(-1px)}
.by img{height:42px;width:auto}
.by span{font-family:var(--font-head);letter-spacing:1.5px;font-size:15px;line-height:1.05;color:#ffe8cc}
.by span small{display:block;font-family:var(--font-body);font-size:10px;letter-spacing:.5px;color:var(--muted);font-weight:600}

/* advanced search */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
.search{position:relative;flex:1;max-width:660px;margin:0 auto}
.sbox{position:relative;border-radius:18px;padding:2px;background:rgba(255,255,255,.1);transition:box-shadow .3s}
.sbox::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--ang),#e5261b,#f7941d,#ffd21f,#e5261b);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;opacity:0;transition:opacity .3s;animation:spin 3s linear infinite;pointer-events:none}
@keyframes spin{to{--ang:360deg}}
.sbox:focus-within{box-shadow:0 0 36px rgba(247,148,29,.32)}
.sbox:focus-within::before{opacity:1}
.sinner{display:flex;align-items:center;gap:10px;background:#170806;border-radius:16px;padding:0 12px 0 16px;height:50px}
.sinner svg{width:20px;height:20px;flex-shrink:0;stroke:var(--orange);fill:none;stroke-width:2.4;stroke-linecap:round;transition:transform .3s}
.sbox:focus-within .sinner svg{transform:scale(1.15) rotate(-8deg)}
.sinner input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.sinner input::placeholder{color:#8f7469}
.kbd{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:1px 8px;background:rgba(255,255,255,.05);white-space:nowrap}
.sclear{display:none;width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.12);font-size:12px;line-height:1}
.sclear:hover{background:var(--red)}
.search.has .sclear{display:block}.search.has .kbd{display:none}
.sdrop{position:absolute;left:0;right:0;top:calc(100% + 10px);background:rgba(22,8,6,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.65);padding:8px;max-height:min(70vh,520px);overflow:auto;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top;transition:.22s}
.sdrop.open{opacity:1;visibility:visible;transform:none}
.sh{font-family:var(--font-head);letter-spacing:1.5px;font-size:14px;color:var(--orange);padding:8px 10px 4px}
.sitem{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer;transition:.15s}
.sitem:hover,.sitem.act{background:linear-gradient(90deg,rgba(229,38,27,.28),rgba(247,148,29,.12))}
.sitem .st{width:58px;height:42px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--grad2)}
.sitem .si{flex:1;min-width:0}
.sitem b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem small{color:var(--muted);font-size:12px}
.sitem mark{background:rgba(255,210,31,.3);color:#ffe27a;border-radius:3px;padding:0 1px}
.sitem .go{opacity:0;transition:.15s;color:var(--orange)}
.sitem.act .go{opacity:1}
.schips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 8px 10px}
.schip{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:4px 14px;font-size:13px;cursor:pointer;transition:.2s}
.schip:hover{background:var(--grad2);border-color:transparent;transform:translateY(-1px)}
.snone{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}
.sfoot{display:flex;gap:14px;padding:8px 12px 4px;border-top:1px solid var(--line);margin-top:6px;font-size:11px;color:var(--muted)}

/* hero */
.hero{position:relative;margin-top:26px;border-radius:28px;overflow:hidden;height:clamp(320px,46vw,640px);border:1px solid var(--line);box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 80px rgba(229,38,27,.14);background:#1a0908;--mx:50%;--my:50%}
.hero::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(520px circle at var(--mx) var(--my),rgba(255,210,31,.14),transparent 60%)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s;display:flex;align-items:flex-end;cursor:pointer;background:linear-gradient(135deg,#8f1d12,#e5261b 45%,#f7941d)}
.slide.on{opacity:1;visibility:visible;z-index:2}
.slide .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 9s ease-out;will-change:transform}
.slide.on .bg{transform:scale(1)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,3,2,.96) 4%,rgba(10,3,2,.5) 48%,rgba(10,3,2,.08));pointer-events:none}
.burst{position:absolute;right:-6%;top:50%;width:min(62%,520px);transform:translateY(-50%);opacity:.22;pointer-events:none}
@keyframes rot{to{transform:translateY(-50%) rotate(360deg)}}
.slide .txt{position:relative;z-index:3;padding:clamp(22px,4vw,48px);max-width:800px}
.slide .txt>*{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
.slide.on .txt>*{opacity:1;transform:none}
.slide.on .txt>:nth-child(2){transition-delay:.15s}.slide.on .txt>:nth-child(3){transition-delay:.3s}.slide.on .txt>:nth-child(4){transition-delay:.45s}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--grad2);color:#fff;font-family:var(--font-head);letter-spacing:1.5px;font-size:15px;padding:2px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(229,38,27,.45)}
.slide h1{font-size:clamp(26px,4.2vw,52px);line-height:1.1;margin:14px 0 10px;font-weight:700;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.slide p{white-space:pre-line;margin:0 0 18px;color:#ffe6d0;max-width:620px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.slide .tm{font-size:13px;color:#ffd9b8;font-weight:600}
.hnav{position:absolute;z-index:6;right:22px;bottom:24px;display:flex;align-items:center;gap:10px}
.hbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(14,5,4,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;font-size:18px;transition:.25s}
.hbtn:hover{background:var(--grad2);transform:scale(1.1)}
.hcount{font-family:var(--font-head);letter-spacing:2px;font-size:20px;min-width:62px;text-align:center}
.hdots{position:absolute;z-index:6;left:clamp(22px,4vw,48px);bottom:14px;display:flex;gap:8px}
.hdots button{width:34px;height:5px;border-radius:5px;border:0;padding:0;background:rgba(255,255,255,.25);cursor:pointer;overflow:hidden;position:relative}
.hdots button i{position:absolute;inset:0;background:var(--grad);transform:scaleX(0);transform-origin:left}
.hdots button.done i{transform:scaleX(1)}
.hdots button.on i{animation:fill var(--dur,6.5s) linear forwards}
.hero.paused .hdots button.on i{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
.hero-empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:10px;position:relative}
.hero-empty h1{font-family:var(--font-head);letter-spacing:3px;font-size:clamp(34px,6vw,64px);margin:0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-empty p{margin:0;color:var(--muted)}

/* browse bar */
.browse{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:34px 0 6px}
.cats{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.cat{border:1px solid var(--line);background:rgba(255,255,255,.05);padding:7px 18px;border-radius:999px;cursor:pointer;font-family:var(--font-head);letter-spacing:1.2px;font-size:17px;transition:.25s;position:relative;overflow:hidden}
.cat:hover{transform:translateY(-2px);border-color:var(--orange)}
.cat.on{background:var(--grad2);border-color:transparent;box-shadow:0 8px 26px rgba(229,38,27,.42)}
.cat em{font-style:normal;font-family:var(--font-body);font-size:11px;font-weight:700;opacity:.7;margin-left:6px}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:5px 16px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:.25s}
.seg button.on{background:rgba(255,255,255,.14);color:#fff}

.sec-title{font-family:var(--font-head);letter-spacing:2.5px;font-size:36px;margin:24px 0 16px;display:flex;align-items:baseline;gap:12px}
.sec-title span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-title small{font-family:var(--font-body);font-size:13px;letter-spacing:0;color:var(--muted);font-weight:600}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:clamp(14px,2vw,28px)}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card h3{font-size:14px}.cbody{padding:10px 11px 12px}.phtxt{font-size:26px}.tag{left:8px;top:8px}.pill{font-size:12px;padding:1px 10px}}
@media(max-width:340px){.grid{grid-template-columns:1fr}}
.cell{opacity:0;transform:translateY(34px) scale(.97);transition:opacity .7s cubic-bezier(.2,.7,.2,1) var(--d,0s),transform .7s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.cell.vis{opacity:1;transform:none}
.card{position:relative;height:100%;border-radius:22px;background:linear-gradient(165deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid var(--line);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .3s;will-change:transform}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;opacity:0;transition:opacity .3s;z-index:4;pointer-events:none}
.card:hover{box-shadow:0 26px 60px rgba(0,0,0,.55),0 0 40px rgba(229,38,27,.25)}
.card:hover::before{opacity:1}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:#240d0a}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover .thumb img{transform:scale(1.1)}
.thumb::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-22deg);transition:left .8s;z-index:2;pointer-events:none}
.card:hover .thumb::after{left:140%}
.thumb.ph{background:radial-gradient(rgba(255,255,255,.3) 1.6px,transparent 2px) 0 0/12px 12px,linear-gradient(135deg,#8f1d12,#e5261b 45%,#f7941d 80%,#ffd21f);display:flex;align-items:center;justify-content:center}
.phtxt{font-family:var(--font-head);font-size:42px;letter-spacing:3px;color:#fff;text-shadow:3px 3px 0 #8f1d12;transform:rotate(-4deg);text-align:center;padding:0 10px;line-height:1.1}
.thumb:not(.ph) .phtxt{display:none}
.thumb .shade{position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,rgba(10,3,2,.7));z-index:1;pointer-events:none}
.tag{position:absolute;left:12px;top:12px;z-index:3}
.tag.pinned{left:auto;right:12px}
.pinbadge{background:var(--yellow);color:#2a0a08;font-family:var(--font-head);letter-spacing:1px;font-size:14px;padding:1px 10px;border-radius:999px;animation:pulseTag 2s ease-in-out infinite}
@keyframes pulseTag{50%{box-shadow:0 0 0 7px rgba(255,210,31,.0),0 0 18px rgba(255,210,31,.8)}}
.play{position:absolute;right:12px;bottom:12px;z-index:3;width:46px;height:46px;border-radius:50%;background:var(--grad2);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 0 0 rgba(247,148,29,.6);animation:ring 2.2s infinite}
@keyframes ring{70%{box-shadow:0 0 0 14px rgba(247,148,29,0)}100%{box-shadow:0 0 0 0 rgba(247,148,29,0)}}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{margin:0;font-size:17px;line-height:1.4;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

function timeAgo(sec) {
  const d = Math.floor(Date.now() / 1000) - sec;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + ' min ago';
  if (d < 86400) return Math.floor(d / 3600) + ' h ago';

/* work out what kind of link this is */
function parseItem(url) {
  if (/^data:image\//i.test(url)) return { type: 'image' };
  let u;
  try { u = new URL(url); } catch (e) { return { type: 'link' }; }
  const h = u.hostname.toLowerCase().replace(/^(www|m|web|mbasic|mobile)\./, '');
  const p = u.pathname;
  if (/\.(jpe?g|png|gif|webp|avif|bmp)$/i.test(p)) return { type: 'image' };
  if (/\.(mp4|webm|mov|m4v)$/i.test(p)) return { type: 'video' };
  if (h === 'youtu.be' || h === 'youtube.com' || h === 'youtube-nocookie.com') {
    let id = '';
    if (h === 'youtu.be') id = p.slice(1).split('/')[0];
    else if (p === '/watch') id = u.searchParams.get('v') || '';
    else { const m = p.match(/^\/(shorts|embed|live|v)\/([\w-]{6,})/); if (m) id = m[2]; }
    if (/^[\w-]{6,}$/.test(id)) return { type: 'youtube', id };
  }
  if (h === 'facebook.com' || h === 'fb.com' || h === 'fb.watch') {
    const isVid = h === 'fb.watch' || /\/(videos?|reel|watch)\b/.test(p);
    return { type: isVid ? 'fbvideo' : 'fbpost', reel: /\/reel\//.test(p) };
  }
  if (h === 'instagram.com') {
    const m = p.match(/^\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/);
    if (m) return { type: 'instagram', kind: m[1] === 'reels' ? 'reel' : m[1], id: m[2] };
  }
  if (h === 'tiktok.com') { const m = p.match(/\/video\/(\d+)/); if (m) return { type: 'tiktok', id: m[1] }; }
  if (h === 'twitter.com' || h === 'x.com') { const m = p.match(/\/status\/(\d+)/); if (m) return { type: 'tweet', id: m[1] }; }
  return { type: 'link' };
}

    if (!S.results.length) return; e.preventDefault();
    S.act = (S.act + (e.key === 'ArrowDown' ? 1 : -1) + S.results.length) % S.results.length;
    $('sdrop').querySelectorAll('.sitem').forEach((el, i) => { el.classList.toggle('act', i === S.act); if (i === S.act) el.scrollIntoView({ block: 'nearest' }); });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (S.act >= 0 && S.results[S.act]) { recent.add(q.value.trim()); sdrop(false); openPost(S.results[S.act].id); }
    else { clearTimeout(st); term = q.value.trim(); shown = SITE.pageSize; if (term.length > 1) recent.add(term); refresh(); sdrop(false); q.blur(); scrollToGrid(); }
  } else if (e.key === 'Escape') { sdrop(false); q.blur(); }
});
$('sdrop').addEventListener('mousedown', e => e.preventDefault());
$('sdrop').addEventListener('click', e => {
  const it = e.target.closest('.sitem');
  if (it) { recent.add(q.value.trim()); sdrop(false); return openPost(S.results[+it.dataset.i].id); }
  const ch = e.target.closest('.schip'); if (!ch) return;
  if (ch.dataset.clear) { recent.clear(); renderSdrop(); return; }
  if (ch.dataset.t) { q.value = ch.dataset.t; q.dispatchEvent(new Event('input')); return; }
  if (ch.dataset.cat) { cat = ch.dataset.cat; term = ''; q.value = ''; $('search').classList.remove('has'); shown = SITE.pageSize; buildCats(); refresh(); sdrop(false); scrollToGrid(); }
});
$('sclear').addEventListener('click', () => { q.value = ''; term = ''; $('search').classList.remove('has'); S.act = -1; refresh(); renderSdrop(); q.focus(); });
document.addEventListener('mousedown', e => { if (!e.target.closest('#search')) sdrop(false); });
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); closePost(); q.focus(); q.select(); }
});
function scrollToGrid() { const t = $('browse').getBoundingClientRect().top + scrollY - 90; scrollTo({ top: t, behavior: 'smooth' }); }

/* ---------- modal ---------- */
function toast(m) { const t = $('toast'); t.textContent = m; t.className = 'toast show'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', 2200); }
let curId = null;
/* SPOT 4: where ads go between the photos of one post */
function embedsWithAds(items) {
  const a = +AO.betweenImages.after || 1, ev = +AO.betweenImages.every || 0, mx = +AO.betweenImages.max || 3;
  let used = 0;
  return items.map((it, i) => {
    const n = i + 1, last = n === items.length;
    const hit = AC.betweenImages && !last && used < mx && (n === a || (ev > 0 && n > a && (n - a) % ev === 0));
    if (hit) used++;
    return renderEmbed(it) + (hit ? '<div class="adslot"></div>' : '');
  }).join('');
}
function openPost(id, noHash) {
  const i = POSTS.findIndex(x => x.id === id); if (i < 0) return;
  const p = POSTS[i]; curId = id;
  const url = location.origin + location.pathname + '#p=' + p.id;
  const rel = POSTS.filter(x => x.id !== id && x.category === p.category).slice(0, 3);
  $('modal').innerHTML = `
    <div class="mtop"><span class="pill">${p.pinned ? '📌 ' : '★ '}${esc(p.category)}</span><span class="sp"></span>
      <button class="cbtn nv" id="mprev" aria-label="Newer">‹</button><button class="cbtn nv" id="mnext" aria-label="Older">›</button><button class="cbtn" id="xBtn" aria-label="Close">✕</button></div>
    <h2>${esc(p.title)}</h2>
    <div class="mmeta">🕒 ${new Date(p.created * 1000).toLocaleString()} · 👁 <i data-v="${esc(p.id)}" data-w="1">${nc(p.views)}</i><span class="vl"> ${p.views === 1 ? 'view' : 'views'}</span></div>
    ${p.desc ? `<div class="desc">${esc(p.desc)}</div>` : ''}
    <div class="embeds">${embedsWithAds(p.items || [])}</div>
    <div id="adPost"></div>
    <div class="share"><button class="btn sm ghost" id="copyBtn">🔗 Copy link</button>
      <a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(p.title + ' ' + url)}">WhatsApp</a>
      <a class="btn sm ghost" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}">Facebook</a></div>
    ${rel.length ? `<div class="related"><h4>MORE ${esc(p.category.toUpperCase())}</h4><div class="rgrid">${rel.map(r => `<div class="rcard" data-id="${esc(r.id)}">${thumbHtml(r).replace(/<span class="tag[\s\S]*$/, '</div>')}<b>${esc(r.title)}</b></div>`).join('')}</div></div>` : ''}`;
  const bcode = AC.betweenImages || '';
  $('modal').querySelectorAll('.adslot').forEach(el => el.appendChild(adBox(bcode)));   // SPOT 4: between photos
  if (AC.postEnd) $('adPost').appendChild(adBox(AC.postEnd));                           // SPOT 5: end of the post
  $('xBtn').onclick = closePost;
  $('mprev').onclick = () => { if (i > 0) openPost(POSTS[i - 1].id); else toast('This is the newest post'); };
  $('mnext').onclick = () => { if (i < POSTS.length - 1) openPost(POSTS[i + 1].id); else toast('No older posts'); };
  $('copyBtn').onclick = async () => { try { await navigator.clipboard.writeText(url); toast('Link copied ✔'); } catch (e) { prompt('Copy this link:', url); } };
  $('modal').querySelectorAll('.rcard').forEach(el => el.onclick = () => openPost(el.dataset.id));
  $('overlay').classList.add('open'); $('overlay').scrollTop = 0; document.body.style.overflow = 'hidden';
  document.title = p.title + ' — Fans';
  countPostView(id);
  if (!noHash && location.hash !== '#p=' + p.id) history.pushState(null, '', '#p=' + p.id);
}
function closePost() {
  if (!$('overlay').classList.contains('open')) return;
  $('overlay').classList.remove('open'); document.body.style.overflow = ''; document.title = 'Fans';
  setTimeout(() => { if (!$('overlay').classList.contains('open')) $('modal').innerHTML = ''; }, 350);
  if (location.hash.startsWith('#p=')) history.pushState(null, '', location.pathname + location.search);
}
$('overlay').addEventListener('mousedown', e => { if (e.target === $('overlay')) closePost(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePost(); });
function openFromHash() {
  const m = location.hash.match(/^#p=([A-Za-z0-9]+)$/);
  if (m) openPost(m[1], true); else if ($('overlay').classList.contains('open')) { $('overlay').classList.remove('open'); document.body.style.overflow = ''; }
}
addEventListener('popstate', openFromHash); addEventListener('hashchange', openFromHash);

/* ---------- scroll effects ---------- */
(function () {
  const nav = $('nav'), prog = $('prog'), top = $('totop');
  let tick = false;
  function on() {
    const y = scrollY, h = document.documentElement.scrollHeight - innerHeight;
    nav.classList.toggle('scrolled', y > 40); top.classList.toggle('show', y > 600);
    prog.style.width = (h > 0 ? y / h * 100 : 0) + '%'; tick = false;
  }
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(on); } }, { passive: true }); on();
  top.onclick = () => scrollTo({ top: 0, behavior: 'smooth' });
})();

startData();
</script>
</body>
